name: nexocode-dev
services:
  nexocode-dev:
    build:
      context: ..
      dockerfile: docker-dev/Dockerfile
      network: host
    image: nexocode-dev:latest
    container_name: nexocode-dev
    stdin_open: true
    tty: true
    environment:
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
    volumes:
      - ..:/workspace:rw
      - bun-cache:/root/.bun/install/cache
      - ../src/node_modules:/workspace/src/node_modules
    network_mode: host
    working_dir: /workspace/src

volumes:
  bun-cache:
